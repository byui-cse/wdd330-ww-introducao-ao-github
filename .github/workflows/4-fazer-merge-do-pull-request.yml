name: Passo 4 # Fazer o merge do pull request

# Verifica se o aluno concluiu as tarefas do passo 4.
# - Roda quando o aluno faz o merge do pull request.
# - Publica a revisão final, atualiza o README e fecha a issue do exercício.
# As tarefas de concluir o exercício ficam neste arquivo (no original vêm de skills/exercise-toolkit)
# para usar os modelos em português de .github/templates/.

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  actions: write
  issues: write

env:
  EXERCISE_TITLE: "Introdução ao GitHub"
  REVIEW_FILE: ".github/steps/x-revisao.md"

jobs:
  find_exercise:
    name: Encontrar a issue do exercício
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.7.0
    with:
      issue-title-text: "Exercício"

  post_review_content:
    name: Publicar a revisão
    needs: [find_exercise]
    runs-on: ubuntu-latest
    if: |
      !github.event.repository.is_template
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar comentário - lição concluída
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/revisao-da-licao.md

      - name: Criar comentário - conteúdo da revisão
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Desativar este workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_readme:
    name: Atualizar o README com os parabéns
    needs: [find_exercise, post_review_content]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Montar a mensagem de parabéns
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/templates/exercicio-concluido-readme.md
          template-vars: |
            login: ${{ github.actor }}
            issue_url: ${{ needs.find_exercise.outputs.issue-url }}
            exercise_title: ${{ env.EXERCISE_TITLE }}
            repository_url: https://github.com/${{ github.repository }}

      - name: Substituir o README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Fazer commit do README com os parabéns
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Parabéns!🎉"
          default_author: github_actions

  finish_issue:
    name: Comentar e fechar a issue
    needs: [find_exercise, update_readme]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar a mensagem de exercício concluído
        id: build-finish-message
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/templates/exercicio-concluido.md
          template-vars: |
            login: ${{ github.actor }}
            repo_full_name: ${{ github.repository }}

      - name: Criar comentário - exercício concluído
        run: gh issue comment "$ISSUE_URL" --body "$FINISH_MESSAGE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
          FINISH_MESSAGE: ${{ steps.build-finish-message.outputs.updated-text }}

      - name: Fechar a issue
        run: gh issue close "$ISSUE_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
