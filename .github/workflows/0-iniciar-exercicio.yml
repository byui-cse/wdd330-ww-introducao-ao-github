name: Passo 0 # Iniciar o exercício

# Versão em português do workflow "Step 0" do exercício original do GitHub Skills.
# As tarefas de iniciar o exercício ficam neste arquivo (no original vêm de skills/exercise-toolkit)
# para que a issue e o README usem os modelos em português de .github/templates/.

on:
  push:
    branches:
      - main

permissions:
  contents: write # Atualizar o README
  actions: write # Desativar/ativar workflows
  issues: write # Criar a issue e comentar nela

env:
  EXERCISE_TITLE: "Introdução ao GitHub"
  ISSUE_TITLE_PREFIX: "Exercício: "
  STEP_1_FILE: ".github/steps/1-criar-um-branch.md"

jobs:
  disable_workflows:
    name: Desativar os workflows do exercício
    if: |
      !github.event.repository.is_template
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Desativar todos os workflows numerados
        run: |
          # Procura todos os workflows cujo nome começa com um número (0-9)
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Desativando o workflow: $workflow_name"
            gh workflow disable "$workflow_name" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_exercise:
    name: Criar a issue do exercício
    if: |
      !github.event.repository.is_template
    runs-on: ubuntu-latest

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar a mensagem de boas-vindas
        id: build-issue-description
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/templates/boas-vindas.md
          template-vars: |
            title: ${{ env.EXERCISE_TITLE }}
            login: ${{ github.actor }}
            intro_message: "Se você está começando no GitHub, talvez perceba que outras pessoas desenvolvedoras usam ___**issues**___ (tarefas ou discussões registradas no repositório) para organizar o trabalho e colaborar. Nós vamos fazer o mesmo! Esse é assunto para outra lição; hoje, vamos apresentar o básico."

      - name: Criar a issue com a mensagem de boas-vindas
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}

  update_readme:
    name: Atualizar o README
    runs-on: ubuntu-latest
    needs: [disable_workflows, create_exercise]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar o novo README
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/templates/exercicio-iniciado.md
          template-vars: |
            title: ${{ env.EXERCISE_TITLE }}
            login: ${{ github.actor }}
            issue_url: ${{ needs.create_exercise.outputs.issue-url }}

      - name: Substituir o README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Fazer commit das alterações
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Iniciar o exercício"
          default_author: github_actions

  post_next_step_content:
    name: Publicar o conteúdo do próximo passo
    runs-on: ubuntu-latest
    needs: [create_exercise, update_readme]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.create_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Criar comentário - conteúdo do passo
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}

      - name: Criar comentário - acompanhando o progresso
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: .github/templates/acompanhando-progresso.md

      - name: Ativar o próximo workflow
        run: |
          gh workflow enable "Passo 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
